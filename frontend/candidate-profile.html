<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Candidate Profile | JobFinder</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 40px;
        }

        .profile-card {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        h1 {
            color: #26364f;
        }

        .info {
            margin: 12px 0;
            color: #555;
        }

        button {
            padding: 12px 20px;
            margin: 10px 8px 0 0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        .back {
            background: white;
            color: #2563eb;
            border: 1px solid #2563eb;
        }
    </style>
</head>

<body>

    <div class="profile-card">

        <div class="avatar">AK</div>

        <h1>Arun Kumar</h1>

        <p class="info"><strong>Position:</strong> Frontend Developer</p>
        <p class="info"><strong>Location:</strong> Chennai</p>
        <p class="info"><strong>Email:</strong> arun@example.com</p>

        <h3>About Candidate</h3>

        <p>
            Frontend Developer with experience in HTML, CSS,
            JavaScript and modern web development.
        </p>

       <button onclick="window.location.href='messages.html'">
    Message
</button>

<button class="profile-btn" onclick="contactCandidate()">
    Contact
</button>

<button onclick="reviewCandidate()">
    Review
</button>
        <button class="back"
                onclick="window.location.href='candidates.html'">
            ← Back to Candidates
        </button>

    </div>
<script>

function sendMessage() {
    alert("Message feature opened for Arun Kumar.");
}

function contactCandidate() {
    alert("Email: arun@example.com\nPhone: +91 98765 43210");
}

function reviewCandidate() {
    alert("Review feature coming soon.");
}

</script>
    


</body>
</html>
