
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Find Jobs | JobFinder</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: #123b8f;
            color: white;
            padding: 30px 8%;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            margin: 0;
        }

        .search-area {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;

            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .search-area input,
        .search-area select {
            padding: 14px;

            border: 1px solid #ddd;
            border-radius: 7px;

            font-size: 16px;
        }

        .search-area input {
            flex: 1;
            min-width: 250px;
        }

        .jobs-container {
            width: 90%;
            max-width: 1000px;
            margin: auto;
        }

        .job-card {
            background: white;

            padding: 25px;
            margin-bottom: 20px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .job-card h2 {
            margin-top: 0;
            color: #123b8f;
        }

        .job-type {
            display: inline-block;

            padding: 6px 12px;

            background: #e8f0ff;
            color: #123b8f;

            border-radius: 20px;

            font-size: 14px;
        }

        .job-location {
            margin-top: 15px;
        }

        .job-salary {
            font-weight: bold;
        }

        .job-description {
            line-height: 1.6;
        }

        .view-btn {
            display: inline-block;

            margin-top: 15px;
            padding: 10px 20px;

            background: #123b8f;
            color: white;

            text-decoration: none;

            border-radius: 6px;
        }

        .no-jobs {
            background: white;
            padding: 40px;

            text-align: center;

            border-radius: 12px;
        }

    </style>

</head>


<body>


<header>

    <h1>Find Jobs</h1>

    <p>
        Find your next great opportunity
    </p>

</header>


<div class="search-area">

    <input
        type="text"
        id="searchInput"
        placeholder="Search jobs..."
    >


    <select id="jobTypeFilter">

        <option value="">
            All Job Types
        </option>

        <option value="Full Time">
            Full Time
        </option>

        <option value="Part Time">
            Part Time
        </option>

        <option value="Internship">
            Internship
        </option>

        <option value="Remote">
            Remote
        </option>

    </select>

</div>


<main class="jobs-container">

    <div id="jobsList"></div>

</main>


<script src="find-jobs.js"></script>


</body>

</html>
